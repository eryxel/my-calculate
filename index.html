<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گالری طلا چنس - محاسبه‌گر قیمت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Yekan Bakh Font (Anti-Filter CDN) -->
    <style>
        @font-face {
            font-family: 'Yekan Bakh';
            src: url('https://cdn.statically.io/gh/DediData/Yekan-Font/main/YekanBakh-Bold.woff2') format('woff2'),
                 url('https://cdn.statically.io/gh/DediData/Yekan-Font/main/YekanBakh-Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Yekan Bakh', Tahoma, Arial, sans-serif !important;
            background-color: #0b1120; /* رنگ پس‌زمینه دقیق مطابق عکس */
            margin: 0;
            padding: 0;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 3D Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            max-width: 520px; /* سایز بهینه برای حفظ تناسب گرافیکی در کامپیوتر و موبایل */
            margin: 0 auto;
        }

        /* Top Panel (Live Price) - Exact Match */
        .panel-glow {
            background-color: #131b2f;
            border: 1px solid rgba(234, 179, 8, 0.4);
            border-radius: 1.25rem;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
        }

        /* Bottom Panel (Calculator) */
        .panel-dark {
            background-color: #131b2f;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Metallic Button */
        .btn-gold {
            background: linear-gradient(180deg, #fcd34d 0%, #d97706 100%);
            border: none;
            border-radius: 0.75rem;
            color: #291000;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-gold:active {
            transform: translateY(2px);
            box-shadow: 0 1px 5px rgba(217, 119, 6, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .btn-gold:hover {
            filter: brightness(1.1);
        }

        /* Input specific hiding of arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Flashing dot */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981; /* Green */
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background-color: #ef4444; /* Red */
            box-shadow: 0 0 8px #ef4444;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #eab308;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-container w-full">
        
        <!-- Header -->
        <div class="text-center mb-8 w-full mt-4">
            <h1 class="text-4xl md:text-5xl text-yellow-500 mb-3 font-bold drop-shadow-lg">گالری طلا چنس</h1>
            <p class="text-gray-300 text-sm md:text-base opacity-80">سیستم هوشمند محاسبه‌گر قطعات طلا</p>
        </div>

        <!-- پنل بالا: قیمت زنده -->
        <div class="panel-glow w-full p-6 mb-6">
            <!-- ردیف اول: عنوان و وضعیت -->
            <div class="flex justify-between items-center mb-6">
                <!-- وضعیت سمت چپ -->
                <div class="flex items-center gap-2">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text" class="text-green-500 text-xs sm:text-sm">نرخ زنده و معتبر</span>
                </div>
                <!-- عنوان سمت راست -->
                <div class="text-gray-300 text-xs sm:text-sm">نرخ زنده هر گرم طلای ۱۸ عیار</div>
            </div>

            <!-- ردیف دوم: قیمت بزرگ -->
            <div class="text-center mb-8 relative min-h-[50px] flex justify-center items-center">
                <div id="price-loading" class="absolute flex justify-center items-center">
                    <div class="loader"></div>
                </div>
                <div id="price-content" class="opacity-0 transition-opacity duration-300 flex items-baseline justify-center gap-2" dir="ltr">
                    <span class="text-yellow-500 text-base sm:text-lg font-normal">تومان</span>
                    <span id="live-price-display" class="text-4xl sm:text-5xl text-white font-bold tracking-tight" style="font-family: 'Yekan Bakh', sans-serif;">--,--,--</span>
                </div>
            </div>

            <!-- ردیف سوم: زمان -->
            <div class="flex justify-end items-center text-[10px] sm:text-xs text-gray-500 font-normal">
                <div id="update-time-display">آخرین بروزرسانی: --:--</div>
            </div>
        </div>

        <!-- پنل پایین: ماشین حساب -->
        <div class="panel-dark w-full p-6 pb-8 relative">
            
            <!-- عنوان پنل -->
            <div class="flex justify-end items-center mb-6 border-b border-gray-700/60 pb-3">
                <h2 class="text-yellow-500 font-bold text-base sm:text-lg">محاسبه قیمت قطعه طلا</h2>
            </div>

            <!-- بخش ورودی وزن -->
            <div class="mb-6 w-full">
                <label for="weight" class="block text-gray-200 mb-3 text-sm text-right">وزن طلا را وارد کنید (گرم)</label>
                
                <!-- اینپوت با طراحی مشابه عکس -->
                <div class="relative w-full bg-[#0b1120]/50 border border-gray-600 rounded-xl flex items-center px-4 py-3 overflow-hidden focus-within:border-yellow-500 transition-colors">
                    <span class="text-gray-300 text-sm ml-3">گرم</span>
                    <!-- input LTR است تا placeholder در سمت چپ بیفتد -->
                    <input type="number" id="weight" step="0.01" dir="ltr" 
                           class="flex-1 bg-transparent border-none text-white focus:ring-0 text-left p-0 text-lg md:text-xl placeholder-gray-600 outline-none" 
                           placeholder="مثال: 4.5">
                </div>
                
                <div id="error-message" class="hidden text-red-500 text-xs mt-2 text-right px-1"></div>
            </div>

            <!-- דکمه محاسبه -->
            <button id="calculate-btn" class="btn-gold w-full py-3.5 text-lg flex justify-center items-center gap-2 mt-2">
                <span>محاسبه قیمت</span>
                <i class="fas fa-calculator ml-1"></i>
            </button>

            <!-- نتیجه نهایی -->
            <div id="result-container" class="hidden flex-col items-center justify-center pt-6 mt-6 border-t border-gray-700/60">
                <div class="text-gray-300 text-sm mb-3">مبلغ نهایی قابل پرداخت</div>
                <div class="flex items-baseline justify-center gap-2 mb-4" dir="ltr">
                    <span class="text-yellow-500 text-base">تومان</span>
                    <span id="final-price" class="text-3xl sm:text-4xl text-white font-bold tracking-tight">۰</span>
                </div>
                <div class="mt-1 text-xs text-gray-400 text-center leading-relaxed">
                    مبلغ محاسبه شده با در نظر گرفتن مالیات، سود فروشنده و ۸ درصد اجرت می‌باشد.
                </div>
            </div>

        </div>
    </div>

    <!-- بارگذاری کتابخانه‌ها از منابع بدون فیلتر -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

    <script>
        // ==========================================
        // ابزارهای تبدیل اعداد به فارسی
        // ==========================================
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        
        // تابع تبدیل اعداد انگلیسی به فارسی
        const toPersianNum = (numStr) => {
            return numStr.toString().replace(/\d/g, x => persianDigits[x]);
        };

        // تابع فرمت پول (جداکننده هزارگان + اعداد فارسی)
        const formatMoney = (amount) => {
            const separated = Math.floor(amount).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return toPersianNum(separated);
        };

        // ==========================================
        // بخش اول: راه‌اندازی پس‌زمینه سه بعدی با Three.js 
        // ==========================================
        const bgCanvas = document.querySelector('#bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60; // تنظیم دوربین برای کادربندی بهتر

        const geometry = new THREE.TetrahedronGeometry(1.5, 0); 
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xca8a04,
            metalness: 0.8,
            roughness: 0.2,
            flatShading: true
        });

        const particles = new THREE.Group();
        scene.add(particles);

        for(let i=0; i<40; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = (Math.random() - 0.5) * 100;
            mesh.position.y = (Math.random() - 0.5) * 100;
            mesh.position.z = (Math.random() - 0.5) * 60 - 10;
            
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            
            mesh.userData = {
                speedX: (Math.random() - 0.5) * 0.02,
                speedY: (Math.random() - 0.5) * 0.02,
                rotSpeed: (Math.random() - 0.5) * 0.04
            };

            particles.add(mesh);
        }

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xfde047, 1);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            particles.children.forEach(mesh => {
                mesh.rotation.x += mesh.userData.rotSpeed;
                mesh.rotation.y += mesh.userData.rotSpeed;
                mesh.position.x += mesh.userData.speedX;
                mesh.position.y += mesh.userData.speedY;
                
                if(mesh.position.x > 50 || mesh.position.x < -50) mesh.userData.speedX *= -1;
                if(mesh.position.y > 50 || mesh.position.y < -50) mesh.userData.speedY *= -1;
            });
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // بخش دوم: افکت‌های صوتی
        // ==========================================
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        synth.set({
            oscillator: { type: "sine" },
            envelope: { attack: 0.05, decay: 0.1, sustain: 0.1, release: 0.5 },
            volume: -10
        });

        function playSuccessSound() {
            if(Tone.context.state !== 'running') Tone.start();
            synth.triggerAttackRelease(["C5", "E5"], "8n");
        }

        function playErrorSound() {
            if(Tone.context.state !== 'running') Tone.start();
            synth.triggerAttackRelease(["C4", "G3"], "8n");
        }

        // ==========================================
        // بخش سوم: دریافت API طلا و محاسبه (با اعداد فارسی)
        // ==========================================
        let currentGoldPrice = null; 
        const API_KEY = "2U0VMB4YTPKIZRoP0WPxlL28bsMUWW92p9cJqHEe1H";
        const API_URL = `https://api.nerkh.io/v2/prices/json/gold/GOLD18K?x-api-key=${API_KEY}`;

        const elements = {
            priceDisplay: document.getElementById('live-price-display'),
            updateTime: document.getElementById('update-time-display'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            loading: document.getElementById('price-loading'),
            content: document.getElementById('price-content'),
            weightInput: document.getElementById('weight'),
            calcBtn: document.getElementById('calculate-btn'),
            resultContainer: document.getElementById('result-container'),
            finalPrice: document.getElementById('final-price'),
            errorMsg: document.getElementById('error-message')
        };

        const updateStatusUI = (isError) => {
            if (isError) {
                elements.statusText.textContent = "خطا عدم دریافت اطلاعات";
                elements.statusText.className = "text-red-500 text-xs sm:text-sm";
                elements.statusDot.classList.add('error');
            } else {
                elements.statusText.textContent = "نرخ زنده و معتبر";
                elements.statusText.className = "text-green-500 text-xs sm:text-sm";
                elements.statusDot.classList.remove('error');
            }
        };

        const showError = (msg) => {
            elements.errorMsg.textContent = msg;
            elements.errorMsg.classList.remove('hidden');
            setTimeout(() => {
                elements.errorMsg.classList.add('hidden');
            }, 5000);
        };

        async function fetchLiveGoldPrice() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 
                        'Accept': 'application/json',
                        'x-api-key': API_KEY
                    },
                    cache: 'no-store'
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const jsonResponse = await response.json();
                let rawPrice = null;

                if (jsonResponse?.data?.prices?.current) {
                    rawPrice = parseFloat(jsonResponse.data.prices.current);
                } else if (jsonResponse?.data?.prices?.GOLD18K?.current) {
                    rawPrice = parseFloat(jsonResponse.data.prices.GOLD18K.current);
                } else if (jsonResponse?.prices?.GOLD18K?.current) {
                    rawPrice = parseFloat(jsonResponse.prices.GOLD18K.current);
                }

                if (!rawPrice || isNaN(rawPrice)) {
                    throw new Error("ساختار پاسخ API با انتظار مطابقت ندارد.");
                }
                
                // قیمت مستقیماً از API خوانده می‌شود (شرط اشتباهِ تقسیم بر 10 حذف شد)
                // اگر روزی متوجه شدید عدد سایت یک صفر اضافه دارد (یعنی ریال است)، کافیست خط زیر را به این شکل تغییر دهید:
                // currentGoldPrice = rawPrice / 10;
                currentGoldPrice = rawPrice; 

                updateStatusUI(false);
                
                // استفاده از اعداد فارسی
                elements.priceDisplay.textContent = formatMoney(currentGoldPrice);
                
                const now = new Date();
                const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                // مطمئن می‌شویم زمان هم فارسی است
                elements.updateTime.textContent = `آخرین بروزرسانی: ${toPersianNum(timeString)}`;

                elements.loading.classList.add('hidden');
                elements.content.classList.remove('opacity-0');

            } catch (error) {
                console.error("خطا در دریافت قیمت:", error);
                
                updateStatusUI(true);
                currentGoldPrice = null; 
                
                elements.priceDisplay.textContent = "---";
                elements.updateTime.textContent = "دریافت نشد";
                
                elements.loading.classList.add('hidden');
                elements.content.classList.remove('opacity-0');
            }
        }

        // عملکرد دکمه محاسبه
        elements.calcBtn.addEventListener('click', () => {
            const weightVal = parseFloat(elements.weightInput.value);

            if (isNaN(weightVal) || weightVal <= 0) {
                playErrorSound();
                showError("لطفاً وزن طلا را به صورت صحیح (مثلاً 4.5) وارد کنید.");
                return;
            }

            if (currentGoldPrice === null || currentGoldPrice <= 0) {
                playErrorSound();
                showError("به دلیل عدم ارتباط با سرور قیمت، محاسبه امکان‌پذیر نیست.");
                return;
            }

            elements.errorMsg.classList.add('hidden');

            // فرمول محاسبه (پایه + 8% + 10% + 3%)
            const baseValue = weightVal * currentGoldPrice;
            const wage = baseValue * 0.08;
            const priceWithWage = baseValue + wage;
            const profit = priceWithWage * 0.10;
            const priceWithProfit = priceWithWage + profit;
            const tax = priceWithProfit * 0.03;
            const finalTotal = priceWithProfit + tax;

            // نمایش با اعداد فارسی
            elements.finalPrice.textContent = formatMoney(finalTotal);
            
            elements.resultContainer.classList.remove('hidden');
            elements.resultContainer.classList.add('flex');
            
            playSuccessSound();
        });

        window.onload = function() {
            animateLoop();
            fetchLiveGoldPrice();
            setInterval(fetchLiveGoldPrice, 60000); 
        };
    </script>
</body>
</html>
